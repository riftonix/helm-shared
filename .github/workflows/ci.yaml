name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  # renovate: datasource=repology depName=manjaro_stable/dagger
  DAGGER_VERSION: 0.21.7
  # renovate: datasource=git-tags depName=riftonix/daggerverse
  GIT_MODULE: github.com/riftonix/daggerverse/modules/git@modules/git/v1.0.2
  # renovate: datasource=git-tags depName=riftonix/daggerverse
  HELM_CI_SCENARIO: github.com/riftonix/daggerverse/scenarios/helm-ci@scenarios/helm-ci/v1.3.0

jobs:
  prepare-targets:
    name: Prepare chart targets
    runs-on: ubuntu-latest

    outputs:
      charts: ${{ steps.charts.outputs.charts }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Find changed charts
        id: charts
        run: |
          {
            echo 'charts<<EOF'
            dagger -m "${GIT_MODULE}" \
              call --silent --json \
              --source=. \
              get-changed-components \
              --base-ref="${{ github.event.pull_request.base.sha }}" \
              --head-ref="${{ github.event.pull_request.head.sha }}" \
              --component-roots='charts/*' \
              --component-roots='libs/*' \
              --shared-paths='.github' \
              --single-component=false
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify ${{ matrix.chart }}
    runs-on: ubuntu-latest
    needs: prepare-targets
    if: ${{ needs.prepare-targets.outputs.charts != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.prepare-targets.outputs.charts) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Verify Helm chart
        run: |
          dagger -m "${HELM_CI_SCENARIO}" \
            call \
            --source="${{ matrix.chart }}" \
            verify-chart

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs:
      - prepare-targets
      - verify
    if: ${{ always() }}

    steps:
      - name: Check CI jobs
        env:
          PREPARE_TARGETS_RESULT: ${{ needs.prepare-targets.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$PREPARE_TARGETS_RESULT" = success
          test "$VERIFY_RESULT" = success || test "$VERIFY_RESULT" = skipped
