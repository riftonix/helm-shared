name: Update charts

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      component:
        description: Component ID (for example common); empty runs all components
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: updatecli-charts
  cancel-in-progress: false

env:
  # renovate: datasource=repology depName=manjaro_stable/dagger
  DAGGER_VERSION: 0.21.11
  # renovate: datasource=github-tags depName=riftonix/daggerverse versioning=semver extractVersion=^scenarios/helm-ci/v(?<version>.*)$
  HELM_CI_SCENARIO: github.com/riftonix/daggerverse/scenarios/helm-ci@scenarios/helm-ci/v1.4.0

jobs:
  update:
    name: Update charts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Update independent component PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
        run: |
          args=()
          if [[ -n "$COMPONENT" ]]; then
            args+=(--components="$COMPONENT")
          fi
          dagger -m "${HELM_CI_SCENARIO}" \
            call \
            --source=. \
            sync-charts-update \
            --github-token=env:GITHUB_TOKEN \
            --repository="${GITHUB_REPOSITORY}" \
            --branch=master \
            "${args[@]}"

      # PRs created with the built-in token do not trigger pull_request workflows.
      - name: Run CI on update branches
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --state open --base master --limit 100 --json headRefName \
            --jq '.[].headRefName | select(startswith("updatecli_master_upstream-"))' |
            while read -r ref; do
              gh workflow run ci.yaml --ref "$ref"
            done
