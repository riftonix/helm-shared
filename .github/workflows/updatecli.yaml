name: Update charts

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component ID (for example common); empty runs all independent pipelines
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: updatecli-charts
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=updatecli/updatecli
  UPDATECLI_VERSION: v0.123.0
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.1

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install adapter dependencies
        run: python3 -m pip install -r updatecli/requirements.txt
      - uses: updatecli/updatecli-action@v2
        with:
          version: ${{ env.UPDATECLI_VERSION }}
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Test Updatecli adapter and manifests
        run: UPDATECLI_BIN="$(command -v updatecli)" python3 -I -m unittest discover -s updatecli/tests -v
      - name: Validate component selection
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          python3 -I -c 'import os,yaml; c=os.environ["COMPONENT"]; assert not c or c in yaml.safe_load(open("updatecli/values.yaml"))["components"], "Unknown component: " + c'
      - name: Update independent component PRs
        env:
          COMPONENT: ${{ inputs.component }}
          # Use a PAT or GitHub App token so PR events trigger CI.
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.UPDATECLI_GITHUB_TOKEN }}
        run: |
          test -n "$UPDATECLI_GITHUB_TOKEN" || { printf '%s\n' 'Configure UPDATECLI_GITHUB_TOKEN first'; exit 1; }
          args=()
          if [[ -n "$COMPONENT" ]]; then
            args+=(--pipeline-ids "upstream-$COMPONENT")
          fi
          updatecli pipeline apply --config updatecli/manifest.yaml --values updatecli/values.yaml \
            --disable-udash-report --disable-version-check --disable-changelog --unique-tmp-dir "${args[@]}"
