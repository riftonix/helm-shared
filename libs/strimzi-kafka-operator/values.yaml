# -- Enable strimzi-kafka-operator chart rendering.
enabled: true

# -- Compatibility values inherited from umbrella charts.
global: {}

# -- Override the default chart label name if needed.
nameOverride: ""

# -- Extra labels applied to every rendered resource.
commonLabels: {}

# -- Extra annotations applied to every rendered resource.
commonAnnotations: {}

# -- Shared metadata and templating values compatible with appchart.
generic:
  # -- Generic labels merged into every rendered resource.
  labels: {}
  # -- Generic annotations merged into every rendered resource.
  annotations: {}

# -- Override these defaults if your cluster uses different Strimzi API versions.
apiVersions:
  # -- Default apiVersion for Kafka resources.
  kafka: kafka.strimzi.io/v1
  # -- Default apiVersion for KafkaNodePool resources.
  kafkaNodePool: kafka.strimzi.io/v1
  # -- Default apiVersion for KafkaConnect resources.
  kafkaConnect: kafka.strimzi.io/v1
  # -- Default apiVersion for KafkaConnector resources.
  kafkaConnector: kafka.strimzi.io/v1
  # -- Default apiVersion for KafkaMirrorMaker2 resources.
  kafkaMirrorMaker2: kafka.strimzi.io/v1
  # -- Default apiVersion for KafkaTopic resources.
  kafkaTopic: kafka.strimzi.io/v1
  # -- Default apiVersion for KafkaUser resources.
  kafkaUser: kafka.strimzi.io/v1
  # -- Default apiVersion for KafkaBridge resources.
  kafkaBridge: kafka.strimzi.io/v1
  # -- Default apiVersion for KafkaRebalance resources.
  kafkaRebalance: kafka.strimzi.io/v1

# Each resource map entry supports:
# - the top-level map key becomes metadata.name by default
# - name: optional explicit metadata.name override
# - namespace: optional, defaults to the release namespace
# - labels: optional
# - annotations: optional
# - apiVersion: optional override for a single resource
# - spec: arbitrary Strimzi custom resource spec rendered as-is
# - status: optional raw status block for fixtures and synthetic manifests
# - set an entry to null in a higher-precedence values file to suppress a lower-precedence default resource

# -- Kafka resources keyed by resource name.
kafkas:
  # -- Example Kafka resource entry used only for generated documentation.
  __helm_docs_example__:
    # -- Optional resource namespace. Defaults to the Helm release namespace.
    namespace: documentation-placeholder
    # -- Labels merged into this resource.
    labels: {}
    # -- Annotations merged into this resource.
    annotations: {}
    # -- Optional apiVersion override for this resource.
    apiVersion: kafka.strimzi.io/v1
    # -- Raw Kafka spec rendered as-is.
    spec:
      # -- Kafka cluster configuration.
      kafka:
        # -- Kafka broker version.
        version: 4.2.0
        # -- Kafka metadata version.
        metadataVersion: 4.2-IV1
        # -- Kafka listeners exposed by the cluster.
        listeners: []
      # -- Strimzi entity operator configuration.
      entityOperator: {}
    # -- Optional raw status block for fixtures and synthetic manifests.
    status: {}

