{{ include "rabbitmq.renderResources" (dict
  "root" $
  "collection" ($.Values.users | default dict)
  "resourceKey" "users"
  "kind" "User"
  "defaultApiVersion" (include "rabbitmq.resolveApiVersion" (dict "root" $ "key" "user" "legacyKey" "user" "default" "rabbitmq.com/v1beta1"))
  "namespaced" true
) }}
