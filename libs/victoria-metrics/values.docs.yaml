# Documentation values source for helm-docs.
# This file expands the generic map-value contract so README.md can include
# nested values. Runtime defaults remain in values.yaml.

# -- Enable victoria-metrics chart rendering.
enabled: true

# -- Compatibility values inherited from umbrella charts. Accepted but ignored by this chart.
global: {}

# -- Override the default chart label name if needed.
nameOverride: ""

# -- Extra labels applied to every rendered resource.
commonLabels: {}
# -- Extra annotations applied to every rendered resource.
commonAnnotations: {}

# -- Default apiVersion overrides per supported VictoriaMetrics Operator kind.
apiVersions:
  # -- Default apiVersion for VMAlert resources.
  vmAlert: operator.victoriametrics.com/v1beta1
  # -- Default apiVersion for VMProbe resources.
  vmProbe: operator.victoriametrics.com/v1beta1
  # -- Default apiVersion for VMRule resources.
  vmRule: operator.victoriametrics.com/v1beta1
  # -- Default apiVersion for VMScrapeConfig resources.
  vmScrapeConfig: operator.victoriametrics.com/v1beta1
  # -- Default apiVersion for VMServiceScrape resources.
  vmServiceScrape: operator.victoriametrics.com/v1beta1
  # -- Default apiVersion for VMStaticScrape resources.
  vmStaticScrape: operator.victoriametrics.com/v1beta1

# -- VMAlert resources to render.
# @default -- {}
vmAlerts:
  example:
    # vmAlerts.example.name -- Resource name.
    # @default -- required
    name: example-vmalert
    # vmAlerts.example.namespace -- Namespace for the resource. Defaults to the release namespace.
    # @default -- .Release.Namespace
    namespace: observability
    # vmAlerts.example.labels -- Resource-specific labels merged with chart labels.
    # @default -- {}
    labels: {}
    # vmAlerts.example.annotations -- Resource-specific annotations merged with chart annotations.
    # @default -- {}
    annotations: {}
    # vmAlerts.example.apiVersion -- Optional apiVersion override for this resource.
    # @default -- .Values.apiVersions.vmAlert
    apiVersion: operator.victoriametrics.com/v1beta1
    # vmAlerts.example.spec -- Raw VMAlert spec rendered as-is.
    # @default -- {}
    spec: {}
    # vmAlerts.example.status -- Optional raw resource status rendered as-is.
    # @default -- not set
    status: {}

