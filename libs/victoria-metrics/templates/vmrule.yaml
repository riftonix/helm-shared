{{- $items := .Values.vmRules | default dict }}
{{- range $entryKey := keys $items | sortAlpha }}
{{- $item := index $items $entryKey }}
{{- if kindIs "map" $item }}
---
{{ include "victoria-metrics.renderResource" (dict
  "root" $
  "item" $item
  "kind" "VMRule"
  "defaultApiVersion" $.Values.apiVersions.vmRule
  "resourceKey" (printf "vmRules[%q]" $entryKey)
  "namespaced" true
) }}
{{- end }}
{{- end }}
