{{- $items := .Values.vmProbes | default dict }}
{{- range $entryKey := keys $items | sortAlpha }}
{{- $item := index $items $entryKey }}
{{- if kindIs "map" $item }}
---
{{ include "victoria-metrics.renderResource" (dict
  "root" $
  "item" $item
  "kind" "VMProbe"
  "defaultApiVersion" $.Values.apiVersions.vmProbe
  "resourceKey" (printf "vmProbes[%q]" $entryKey)
  "namespaced" true
) }}
{{- end }}
{{- end }}
