# -- Override the default chart label name if needed.
nameOverride: ""

# -- Extra labels applied to every rendered resource.
commonLabels: {}
# -- Extra annotations applied to every rendered resource.
commonAnnotations: {}

# The defaults below are aligned with the upstream Envoy Gateway CRDs chart.
# Override them only if you intentionally target another API version.
apiVersions:
  # -- Default apiVersion for Backend resources.
  backend: gateway.envoyproxy.io/v1alpha1
  # -- Default apiVersion for BackendTrafficPolicy resources.
  backendTrafficPolicy: gateway.envoyproxy.io/v1alpha1
  # -- Default apiVersion for ClientTrafficPolicy resources.
  clientTrafficPolicy: gateway.envoyproxy.io/v1alpha1
  # -- Default apiVersion for EnvoyExtensionPolicy resources.
  envoyExtensionPolicy: gateway.envoyproxy.io/v1alpha1
  # -- Default apiVersion for EnvoyPatchPolicy resources.
  envoyPatchPolicy: gateway.envoyproxy.io/v1alpha1
  # -- Default apiVersion for EnvoyProxy resources.
  envoyProxy: gateway.envoyproxy.io/v1alpha1
  # -- Default apiVersion for HTTPRouteFilter resources.
  httpRouteFilter: gateway.envoyproxy.io/v1alpha1
  # -- Default apiVersion for SecurityPolicy resources.
  securityPolicy: gateway.envoyproxy.io/v1alpha1

# Each map entry supports:
# - the top-level map key becomes metadata.name
# - namespace: optional for namespaced resources, defaults to the release namespace
# - labels: optional
# - annotations: optional
# - apiVersion: optional override for a single resource
# - spec: validated against the upstream Envoy Gateway CRD schema
# - status: optional raw status block for fixtures and synthetic manifests

