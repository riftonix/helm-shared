# -- Enable cloudnativepg chart rendering.
enabled: true

# -- Compatibility values inherited from umbrella charts. Accepted but ignored by this chart.
global: {}

# -- Override the default chart label name if needed.
nameOverride: ""

# -- Extra labels applied to every rendered resource.
commonLabels: {}
# -- Extra annotations applied to every rendered resource.
commonAnnotations: {}

# The defaults below align with the CloudNativePG CRDs bundled in tests/e2e/crds/cloudnative-pg-crds.yaml.
apiVersions:
  # -- Default apiVersion for Backup resources.
  backup: postgresql.cnpg.io/v1
  # -- Default apiVersion for ClusterImageCatalog resources.
  clusterImageCatalog: postgresql.cnpg.io/v1
  # -- Default apiVersion for Cluster resources.
  cluster: postgresql.cnpg.io/v1
  # -- Default apiVersion for Database resources.
  database: postgresql.cnpg.io/v1
  # -- Default apiVersion for FailoverQuorum resources.
  failoverQuorum: postgresql.cnpg.io/v1
  # -- Default apiVersion for ImageCatalog resources.
  imageCatalog: postgresql.cnpg.io/v1
  # -- Default apiVersion for Pooler resources.
  pooler: postgresql.cnpg.io/v1
  # -- Default apiVersion for Publication resources.
  publication: postgresql.cnpg.io/v1
  # -- Default apiVersion for ScheduledBackup resources.
  scheduledBackup: postgresql.cnpg.io/v1
  # -- Default apiVersion for Subscription resources.
  subscription: postgresql.cnpg.io/v1

# Each map entry supports:
# - the top-level map key becomes metadata.name
# - namespace: optional for namespaced resources, defaults to the release namespace
# - labels: optional
# - annotations: optional
# - apiVersion: optional override for a single resource
# - spec: resource spec rendered as-is
# - set an entry to null in a higher-precedence values file to suppress a lower-precedence default resource
# - status: optional raw status block for fixtures and synthetic manifests

# -- Backup resources keyed by resource name.
# @default -- {}
backups:
  __helm_docs_example__:
    # -- Namespace for namespaced resources. Defaults to the Helm release namespace. Ignored for cluster-scoped kinds.
    # @default -- release namespace
    namespace: documentation-placeholder
    # -- Resource-specific labels.
    labels: {}
    # -- Resource-specific annotations.
    annotations: {}
    # -- Per-resource apiVersion override.
    # @default -- chart default for this kind
    apiVersion: postgresql.cnpg.io/v1
    # -- Specification of the desired behavior of the backup. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status.
    spec:
      # -- The cluster to backup.
      cluster:
        # -- Name of the referent.
        name: "documentation-placeholder"
      # -- The backup method to be used, possible options are 'barmanObjectStore', 'volumeSnapshot' or 'plugin'. Defaults to: 'barmanObjectStore'.
      method: "barmanObjectStore"
      # -- Whether the default type of backup with volume snapshots is online/hot ('true', default) or offline/cold ('false') Overrides the default setting specified in the cluster field '.spec.backup.volumeSnapshot.online'.
      online: false
      # -- Configuration parameters to control the online/hot backup with volume snapshots Overrides the default settings specified in the cluster '.backup.volumeSnapshot.onlineConfiguration' stanza.
      onlineConfiguration:
        # -- Control whether the I/O workload for the backup initial checkpoint will be limited, according to the 'checkpoint_completion_target' setting on the PostgreSQL server. If set to true, an immediate checkpoint will be used, meaning PostgreSQL will complete the checkpoint as soon as possible. 'false' by default.
        immediateCheckpoint: false
        # -- If false, the function will return immediately after the backup is completed, without waiting for WAL to be archived. This behavior is only useful with backup software that independently monitors WAL archiving. Otherwise, WAL required to make the backup consistent might be missing and make the backup useless. By default, or when this parameter is true, pg_backup_stop will wait for WAL to be archived when archiving is enabled. On a standby, this means that it will wait only when archive_mode = always. If write activity on the primary is low, it may be useful to run pg_switch_wal on the primary in order to trigger an immediate segment switch.
        waitForArchive: true
      # -- Configuration parameters passed to the plugin managing this backup.
      pluginConfiguration:
        # -- Name is the name of the plugin managing this backup.
        name: "documentation-placeholder"
        # -- Parameters are the configuration parameters passed to the backup plugin for this backup.
        parameters:
          # -- documentation-placeholder field.
          documentation-placeholder: "documentation-placeholder"
      # -- The policy to decide which instance should perform this backup. If empty, it defaults to 'cluster.spec.backup.target'. Available options are empty string, 'primary' and 'prefer-standby'. 'primary' to have backups run always on primary instances, 'prefer-standby' to have backups run preferably on the most updated standby, if available.
      target: "primary"
    # -- Most recently observed status of the backup. This data may not be up to date. Populated by the system. Read-only. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status.
    status:
      # -- The credentials to use to upload data to Azure Blob Storage.
      azureCredentials:
        # -- The connection string to be used.
        connectionString:
          # -- The key to select.
          key: "documentation-placeholder"
          # -- Name of the referent.
          name: "documentation-placeholder"
        # -- Use the Azure AD based authentication without providing explicitly the keys.
        inheritFromAzureAD: false
        # -- The storage account where to upload data.
        storageAccount:
          # -- The key to select.
          key: "documentation-placeholder"
          # -- Name of the referent.
          name: "documentation-placeholder"
        # -- The storage account key to be used in conjunction with the storage account name.
        storageKey:
          # -- The key to select.
          key: "documentation-placeholder"
          # -- Name of the referent.
          name: "documentation-placeholder"
        # -- A shared-access-signature to be used in conjunction with the storage account name.
        storageSasToken:
          # -- The key to select.
          key: "documentation-placeholder"
          # -- Name of the referent.
          name: "documentation-placeholder"
        # -- Use the default Azure authentication flow, which includes DefaultAzureCredential. This allows authentication using environment variables and managed identities.
        useDefaultAzureCredentials: false
      # -- The ID of the Barman backup.
      backupId: "documentation-placeholder"
      # -- Backup label file content as returned by Postgres in case of online (hot) backups.
      backupLabelFile: "backup-label"
      # -- The Name of the Barman backup.
      backupName: "documentation-placeholder"
      # -- The starting xlog.
      beginLSN: "documentation-placeholder"
      # -- The starting WAL.
      beginWal: "documentation-placeholder"
      # -- The backup command output in case of error.
      commandError: "documentation-placeholder"
      # -- Unused. Retained for compatibility with old versions.
      commandOutput: "documentation-placeholder"
      # -- The path where to store the backup (i.e. s3://bucket/path/to/folder) this path, with different destination folders, will be used for WALs and for data. This may not be populated in case of errors.
      destinationPath: "s3://documentation-placeholder"
      # -- Encryption method required to S3 API.
      encryption: "AES256"
      # -- The ending xlog.
      endLSN: "documentation-placeholder"
      # -- The ending WAL.
      endWal: "documentation-placeholder"
      # -- EndpointCA store the CA bundle of the barman endpoint. Useful when using self-signed certificates to avoid errors with certificate issuer and barman-cloud-wal-archive.
      endpointCA:
        # -- The key to select.
        key: "documentation-placeholder"
        # -- Name of the referent.
        name: "documentation-placeholder"
      # -- Endpoint to be used to upload data to the cloud, overriding the automatic endpoint discovery.
      endpointURL: "documentation-placeholder"
      # -- The detected error.
      error: "documentation-placeholder"
      # -- The credentials to use to upload data to Google Cloud Storage.
      googleCredentials:
        # -- The secret containing the Google Cloud Storage JSON file with the credentials.
        applicationCredentials:
          # -- The key to select.
          key: "documentation-placeholder"
          # -- Name of the referent.
          name: "documentation-placeholder"
        # -- If set to true, will presume that it's running inside a GKE environment, default to false.
        gkeEnvironment: false
      # -- Information to identify the instance where the backup has been taken from.
      instanceID:
        # -- The container ID.
        ContainerID: "documentation-placeholder"
        # -- The pod name.
        podName: "documentation-placeholder"
        # -- The instance manager session ID. This is a unique identifier generated at instance manager startup and changes on every restart (including container reboots). Used to detect if the instance manager was restarted during long-running operations like backups, which would terminate any running backup process.
        sessionID: "documentation-placeholder"
      # -- The PostgreSQL major version that was running when the backup was taken.
      majorVersion: 1
      # -- The backup method being used.
      method: "barmanObjectStore"
      # -- Whether the backup was online/hot ('true') or offline/cold ('false').
      online: false
      # -- The last backup status.
      phase: "documentation-placeholder"
      # -- A map containing the plugin metadata.
      pluginMetadata:
        # -- documentation-placeholder field.
        documentation-placeholder: "documentation-placeholder"
      # -- When the backup process was started by the operator.
      reconciliationStartedAt: "2026-01-01T00:00:00Z"
      # -- When the reconciliation was terminated by the operator (either successfully or not).
      reconciliationTerminatedAt: "2026-01-01T00:00:00Z"
      # -- The credentials to use to upload data to S3.
      s3Credentials:
        # -- The reference to the access key id.
        accessKeyId:
          # -- The key to select.
          key: "documentation-placeholder"
          # -- Name of the referent.
          name: "documentation-placeholder"
        # -- Use the role based authentication without providing explicitly the keys.
        inheritFromIAMRole: false
        # -- The reference to the secret containing the region name.
        region:
          # -- The key to select.
          key: "documentation-placeholder"
          # -- Name of the referent.
          name: "documentation-placeholder"
        # -- The reference to the secret access key.
        secretAccessKey:
          # -- The key to select.
          key: "documentation-placeholder"
          # -- Name of the referent.
          name: "documentation-placeholder"
        # -- The references to the session key.
        sessionToken:
          # -- The key to select.
          key: "documentation-placeholder"
          # -- Name of the referent.
          name: "documentation-placeholder"
      # -- The server name on S3, the cluster name is used if this parameter is omitted.
      serverName: "documentation-placeholder"
      # -- Status of the volumeSnapshot backup.
      snapshotBackupStatus:
        # -- The elements list, populated with the gathered volume snapshots.
        elements:
          -
            # -- Name is the snapshot resource name.
            name: "documentation-placeholder"
            # -- TablespaceName is the name of the snapshotted tablespace. Only set when type is PG_TABLESPACE.
            tablespaceName: "documentation-placeholder"
            # -- Type is tho role of the snapshot in the cluster, such as PG_DATA, PG_WAL and PG_TABLESPACE.
            type: "rw"
      # -- When the backup execution was started by the backup tool.
      startedAt: "2026-01-01T00:00:00Z"
      # -- When the backup execution was terminated by the backup tool.
      stoppedAt: "2026-01-01T00:00:00Z"
      # -- Tablespace map file content as returned by Postgres in case of online (hot) backups.
      tablespaceMapFile: "ZG9jdW1lbnRhdGlvbi1wbGFjZWhvbGRlcg=="

# -- ClusterImageCatalog resources keyed by resource name.
# @default -- {}
clusterImageCatalogs:
  __helm_docs_example__:
    # -- Namespace for namespaced resources. Defaults to the Helm release namespace. Ignored for cluster-scoped kinds.
    # @default -- ""
    namespace: documentation-placeholder
    # -- Resource-specific labels.
    labels: {}
    # -- Resource-specific annotations.
    annotations: {}
    # -- Per-resource apiVersion override.
    # @default -- chart default for this kind
    apiVersion: postgresql.cnpg.io/v1
    # -- Specification of the desired behavior of the ClusterImageCatalog. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status.
    spec:
      # -- List of CatalogImages available in the catalog.
      images:
        -
          # -- The configuration of the extensions to be added.
          extensions:
            -
              # -- A list of directories within the image to be appended to the PostgreSQL process's 'PATH' environment variable.
              bin_path:
                - "documentation-placeholder"
              # -- The list of directories inside the image which should be added to dynamic_library_path. If not defined, defaults to "/lib".
              dynamic_library_path:
                - "documentation-placeholder"
              # -- Env is a list of custom environment variables to be set in the PostgreSQL process for this extension. It is the responsibility of the cluster administrator to ensure the variables are correct for the specific extension. Note that changes to these variables require a manual cluster restart to take effect.
              env:
                -
                  # -- Name of the environment variable to be injected into the PostgreSQL process.
                  name: "DOCUMENTATION_PLACEHOLDER"
                  # -- Value of the environment variable. CloudNativePG performs a direct replacement of this value, with support for placeholder expansion. The ${'image_root'} placeholder resolves to the absolute mount path of the extension's volume (e.g., '/extensions/my-extension'). This is particularly useful for allowing applications or libraries to locate specific directories within the mounted image. Unrecognized placeholders are rejected. To include a literal ${...} in the value, escape it as $${...}.
                  value: "documentation-placeholder"
              # -- The list of directories inside the image which should be added to extension_control_path. If not defined, defaults to "/share".
              extension_control_path:
                - "documentation-placeholder"
              # -- The image containing the extension.
              image:
                # -- Policy for pulling OCI objects. Possible values are: Always: the kubelet always attempts to pull the reference. Container creation will fail If the pull fails. Never: the kubelet never pulls the reference and only uses a local image or artifact. Container creation will fail if the reference isn't present. IfNotPresent: the kubelet pulls if the reference isn't already present on disk. Container creation will fail if the reference isn't present and the pull fails. Defaults to Always if :latest tag is specified, or IfNotPresent otherwise.
                pullPolicy: "documentation-placeholder"
                # -- Required: Image or artifact reference to be used. Behaves in the same way as pod.spec.containers[*].image. Pull secrets will be assembled in the same way as for the container image by looking up node credentials, SA image pull secrets, and pod spec image pull secrets. More info: https://kubernetes.io/docs/concepts/containers/images This field is optional to allow higher level config management to default or override container images in workload controllers like Deployments and StatefulSets.
                reference: "documentation-placeholder"
              # -- The list of directories inside the image which should be added to ld_library_path.
              ld_library_path:
                - "documentation-placeholder"
              # -- The name of the extension, required.
              name: "documentation-placeholder"
          # -- The image reference.
          image: "ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie"
          # -- The PostgreSQL major version of the image. Must be unique within the catalog.
          major: 10

# -- Cluster resources keyed by resource name.
# @default -- {}
clusters:
  __helm_docs_example__:
    # -- Namespace for namespaced resources. Defaults to the Helm release namespace. Ignored for cluster-scoped kinds.
    # @default -- release namespace
    namespace: documentation-placeholder
    # -- Resource-specific labels.
    labels: {}
    # -- Resource-specific annotations.
    annotations: {}
    # -- Per-resource apiVersion override.
    # @default -- chart default for this kind
    apiVersion: postgresql.cnpg.io/v1
    # -- Specification of the desired behavior of the cluster. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status.
    spec:
      # -- Affinity/Anti-affinity rules for Pods.
      affinity:
        # -- AdditionalPodAffinity allows to specify pod affinity terms to be passed to all the cluster's pods.
        additionalPodAffinity:
          # -- The scheduler will prefer to schedule pods to nodes that satisfy the affinity expressions specified by this field, but it may choose a node that violates one or more of the expressions. The node that is most preferred is the one with the greatest sum of weights, i.e. for each node that meets all of the scheduling requirements (resource request, requiredDuringScheduling affinity expressions, etc.), compute a sum by iterating through the elements of this field and adding "weight" to the sum if the node has pods which matches the corresponding podAffinityTerm; the node(s) with the highest sum are the most preferred.
          preferredDuringSchedulingIgnoredDuringExecution:
            -
              # -- Required. A pod affinity term, associated with the corresponding weight.
              podAffinityTerm:
                # -- A label query over a set of resources, in this case pods. If it's null, this PodAffinityTerm matches with no Pods.
                labelSelector:
                  # -- matchExpressions is a list of label selector requirements. The requirements are ANDed.
                  matchExpressions:
                    -
                      # -- key is the label key that the selector applies to.
                      key: "documentation-placeholder"
                      # -- operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                      operator: "documentation-placeholder"
                      # -- values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                      values:
                        - "documentation-placeholder"
                  # -- matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                  matchLabels:
                    # -- documentation-placeholder field.
                    documentation-placeholder: "documentation-placeholder"
                # -- MatchLabelKeys is a set of pod label keys to select which pods will be taken into consideration. The keys are used to lookup values from the incoming pod labels, those key-value labels are merged with 'labelSelector' as 'key in (value)' to select the group of existing pods which pods will be taken into consideration for the incoming pod's pod (anti) affinity. Keys that don't exist in the incoming pod labels will be ignored. The default value is empty. The same key is forbidden to exist in both matchLabelKeys and labelSelector. Also, matchLabelKeys cannot be set when labelSelector isn't set.
                matchLabelKeys:
                  - "documentation-placeholder"
                # -- MismatchLabelKeys is a set of pod label keys to select which pods will be taken into consideration. The keys are used to lookup values from the incoming pod labels, those key-value labels are merged with 'labelSelector' as 'key notin (value)' to select the group of existing pods which pods will be taken into consideration for the incoming pod's pod (anti) affinity. Keys that don't exist in the incoming pod labels will be ignored. The default value is empty. The same key is forbidden to exist in both mismatchLabelKeys and labelSelector. Also, mismatchLabelKeys cannot be set when labelSelector isn't set.
                mismatchLabelKeys:
                  - "documentation-placeholder"
                # -- A label query over the set of namespaces that the term applies to. The term is applied to the union of the namespaces selected by this field and the ones listed in the namespaces field. null selector and null or empty namespaces list means "this pod's namespace". An empty selector ({}) matches all namespaces.
                namespaceSelector:
                  # -- matchExpressions is a list of label selector requirements. The requirements are ANDed.
                  matchExpressions:
                    -
                      # -- key is the label key that the selector applies to.
                      key: "documentation-placeholder"
                      # -- operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                      operator: "documentation-placeholder"
                      # -- values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                      values:
                        - "documentation-placeholder"
                  # -- matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                  matchLabels:
                    # -- documentation-placeholder field.
                    documentation-placeholder: "documentation-placeholder"
                # -- namespaces specifies a static list of namespace names that the term applies to. The term is applied to the union of the namespaces listed in this field and the ones selected by namespaceSelector. null or empty namespaces list and null namespaceSelector means "this pod's namespace".
                namespaces:
                  - "documentation-placeholder"
                # -- This pod should be co-located (affinity) or not co-located (anti-affinity) with the pods matching the labelSelector in the specified namespaces, where co-located is defined as running on a node whose value of the label with key topologyKey matches that of any node on which any of the selected pods is running. Empty topologyKey is not allowed.
                topologyKey: "documentation-placeholder"
              # -- weight associated with matching the corresponding podAffinityTerm, in the range 1-100.
              weight: 1
          # -- If the affinity requirements specified by this field are not met at scheduling time, the pod will not be scheduled onto the node. If the affinity requirements specified by this field cease to be met at some point during pod execution (e.g. due to a pod label update), the system may or may not try to eventually evict the pod from its node. When there are multiple elements, the lists of nodes corresponding to each podAffinityTerm are intersected, i.e. all terms must be satisfied.
          requiredDuringSchedulingIgnoredDuringExecution:
            -
              # -- A label query over a set of resources, in this case pods. If it's null, this PodAffinityTerm matches with no Pods.
              labelSelector:
                # -- matchExpressions is a list of label selector requirements. The requirements are ANDed.
                matchExpressions:
                  -
