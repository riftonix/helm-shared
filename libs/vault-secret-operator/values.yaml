# -- Arbitrary global values available to tpl-rendered strings.
global: {}

apiVersions:
  # -- Default apiVersion for HCPAuth resources.
  hcpAuth: secrets.hashicorp.com/v1beta1
  # -- Default apiVersion for HCPVaultSecretsApp resources.
  hcpVaultSecretsApp: secrets.hashicorp.com/v1beta1
  # -- Default apiVersion for SecretTransformation resources.
  secretTransformation: secrets.hashicorp.com/v1beta1
  # -- Default apiVersion for VaultAuth resources.
  vaultAuth: secrets.hashicorp.com/v1beta1
  # -- Default apiVersion for VaultAuthGlobal resources.
  vaultAuthGlobal: secrets.hashicorp.com/v1beta1
  # -- Default apiVersion for VaultConnection resources.
  vaultConnection: secrets.hashicorp.com/v1beta1
  # -- Default apiVersion for VaultDynamicSecret resources.
  vaultDynamicSecret: secrets.hashicorp.com/v1beta1
  # -- Default apiVersion for VaultPKISecret resources.
  vaultPKISecret: secrets.hashicorp.com/v1beta1
  # -- Default apiVersion for VaultStaticSecret resources.
  vaultStaticSecret: secrets.hashicorp.com/v1beta1

# Each resource map entry supports:
# - the top-level map key becomes metadata.name
# - namespace: optional, defaults to the release namespace
# - labels: optional
# - annotations: optional
# - apiVersion: optional override for a single resource
# - spec: arbitrary resource spec rendered as-is
# - status: optional raw status block for fixtures and synthetic manifests
# - set an entry to null in a higher-precedence values file to suppress a lower-precedence default resource

