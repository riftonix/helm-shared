# -- VaultStaticSecret resources keyed by resource name.
vaultStaticSecrets:
  __helm_docs_example__:
    # -- Namespace for the VaultStaticSecret resource. Defaults to the Helm release namespace.
    namespace: documentation-placeholder
    # -- Resource-specific labels.
    labels: {}
    # -- Resource-specific annotations.
    annotations: {}
    # -- Per-resource apiVersion override.
    apiVersion: secrets.hashicorp.com/v1beta1
    # -- VaultAuth reference. Defaults to `global.project`, the sole `vaultAuths` key, legacy `vaultAuth.name`, or the generated chart fullname for legacy `vaultAuth`.
    vaultAuthRef: documentation-placeholder
    # -- Vault Enterprise namespace used for the secret engine mount. Rendered as `spec.namespace`.
    vaultNamespace: ""
    # -- Secret engine type for VSO.
    vaultType: kv-v2
    # -- Vault mount.
    mount: develop
    # -- Vault path.
    path: application/dev/envs
    # -- Optional secret version. Rendered as `spec.version`.
    version: 1
    # -- Secret refresh interval.
    refreshAfter: 1m
    # -- Whether VSO should compute HMAC for drift detection. Rendered as `spec.hmacSecretData`.
    hmacSecretData: true
    # -- Destination Kubernetes Secret name. Defaults to the map key.
    destSec: app-secret
    # -- Whether VSO should create the destination Secret.
    create: true
    # -- Whether VSO should overwrite the destination Secret when it already exists.
    overwrite: false
    # -- Destination Kubernetes Secret type. Kept compatible with the previous chart format.
    type: Opaque
    # -- Optional explicit destination Secret type.
    destinationType: ""
    # -- Optional labels merged into `spec.destination.labels`.
    destinationLabels: {}
    # -- Optional annotations merged into `spec.destination.annotations`.
    destinationAnnotations: {}
    # -- Optional transformation rendered as `spec.destination.transformation`.
    transformation: {}
    # -- Optional full destination block rendered as `spec.destination`.
    destination: {}
    # -- Optional sync configuration rendered as `spec.syncConfig`.
    syncConfig: {}
    # -- Optional rollout restart targets.
    restartTargets: []
    # -- Optional raw spec rendered as-is. When set, shorthand fields above are ignored.
    spec: {}
